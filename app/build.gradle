plugins {
    id 'com.android.application'
}

// La messagerie push (FCM) nécessite google-services.json.
// Sans ce fichier, l'app compile et fonctionne en mode local + Supabase, sans push.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.perl.planningenfants'
    compileSdk 35

    defaultConfig {
        applicationId 'com.perl.planningenfants'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.work:work-runtime:2.10.1'
}
